<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudySeq 详情页概念</title>
    <style>
      @import url("https://cdn.jsdelivr.net/npm/misans-webfont@4.3.1/misans-style.css");
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap");

      :root {
        --bg-top: #eef5ff;
        --bg-bottom: #f7fbff;
        --sky-ink: #0f2857;
        --sky-text: #1c376a;
        --sky-muted: #6a7b9d;
        --sky-line: rgba(40, 78, 150, 0.12);
        --sky-line-soft: rgba(40, 78, 150, 0.08);
        --sky-cloud: rgba(255, 255, 255, 0.76);
        --sky-cloud-strong: rgba(255, 255, 255, 0.96);
        --accent: #2b61df;
        --accent-strong: #1f4fc7;
        --blue: #2b61df;
        --green: #2f7d59;
        --amber: #b06e2d;
        --danger: #c3554d;
        --shadow: 0 18px 50px rgba(76, 115, 197, 0.08);
        --radius-xl: 18px;
        --radius-lg: 16px;
        --radius-md: 14px;
        --radius-sm: 999px;
        --font-ui: "MiSans", "PingFang SC", "Microsoft YaHei UI",
          sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        min-height: 100vh;
        color: var(--sky-ink);
        font-family: var(--font-ui);
        background:
          radial-gradient(circle at top left, rgba(255, 255, 255, 0.88), transparent 26%),
          radial-gradient(circle at 82% 10%, rgba(173, 200, 255, 0.48), transparent 28%),
          linear-gradient(180deg, var(--bg-top), var(--bg-bottom) 62%, #fdfefe);
      }

      h1,
      h2,
      h3,
      p {
        margin: 0;
      }

      button {
        font: inherit;
        border: 0;
        cursor: pointer;
      }

      .app-shell {
        width: min(1400px, calc(100% - 28px));
        min-height: calc(100vh - 28px);
        margin: 14px auto;
        padding: 12px;
        border: 1px solid var(--sky-line);
        border-radius: var(--radius-xl);
        background: rgba(255, 255, 255, 0.56);
        box-shadow: var(--shadow);
        backdrop-filter: blur(16px);
      }

      .main-panel {
        min-height: calc(100vh - 56px);
        padding: 24px;
        border-radius: var(--radius-lg);
        background:
          radial-gradient(circle at top right, rgba(43, 97, 223, 0.06), transparent 22%),
          linear-gradient(180deg, rgba(255, 255, 255, 0.92), rgba(247, 251, 255, 0.94));
      }

      .topbar {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
      }

      .eyebrow {
        margin-bottom: 6px;
        color: var(--sky-muted);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .topbar h1 {
        font-size: clamp(32px, 4.2vw, 42px);
        line-height: 1.05;
        letter-spacing: -0.03em;
        font-weight: 500;
      }

      .topbar p {
        margin-top: 12px;
        max-width: 720px;
        color: var(--sky-text);
        font-size: 16px;
        line-height: 1.7;
        font-weight: 400;
      }

      .eyebrow,
      .toolbar,
      .materials-head,
      .note-head,
      .folder-count,
      .chip,
      .note-item-top span,
      .footer-note {
        font-family: "Inter", "MiSans", "PingFang SC", "Microsoft YaHei UI",
          sans-serif;
      }

      .toolbar {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .ghost-button,
      .primary-button {
        height: 46px;
        padding: 0 16px;
        border-radius: var(--radius-md);
        font-size: 13px;
        font-weight: 400;
        font-family: "MiSans", "PingFang SC", "Microsoft YaHei UI",
          sans-serif;
        letter-spacing: 0.06em;
      }

      .ghost-button {
        color: var(--sky-text);
        border: 1px solid var(--sky-line);
        background: rgba(255, 255, 255, 0.84);
      }

      .primary-button {
        color: #fff;
        background: linear-gradient(180deg, #3d73eb, var(--accent-strong));
        box-shadow: 0 10px 26px rgba(43, 97, 223, 0.24);
      }

      .section {
        margin-top: 20px;
      }

      .section-label {
        display: inline-flex;
        align-items: center;
        padding: 8px 10px;
        border-radius: 999px;
        background: rgba(29, 78, 216, 0.08);
        color: var(--accent);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.06em;
      }

      .materials-card,
      .notes-card {
        margin-top: 12px;
        border: 1px solid var(--sky-line-soft);
        border-radius: var(--radius-lg);
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.94), rgba(243, 247, 255, 0.92));
        box-shadow: 0 10px 24px rgba(64, 96, 156, 0.06);
      }

      .materials-card {
        overflow: hidden;
      }

      .materials-head,
      .note-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 12px 14px;
        border-bottom: 1px solid rgba(40, 78, 150, 0.08);
      }

      .materials-head strong,
      .note-head strong {
        font-size: 14px;
        font-weight: 600;
      }

      .materials-head strong {
        font-size: 15px;
      }

      .materials-head span,
      .note-head span {
        color: var(--sky-muted);
        font-size: 12px;
      }

      .folder-list {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 18px 14px;
        padding: 16px 14px 18px;
        background: linear-gradient(180deg, rgba(231, 239, 255, 0.36), rgba(247, 251, 255, 0.12));
      }

      .folder {
        display: grid;
        justify-items: center;
        align-content: start;
        gap: 8px;
        padding: 10px 8px 8px;
        border-radius: 12px;
        transition: transform 160ms ease, background-color 160ms ease;
      }

      .folder:hover {
        transform: translateY(-1px);
        background: rgba(255, 255, 255, 0.36);
      }

      .folder-icon {
        position: relative;
        width: 92px;
        height: 70px;
        border-radius: 10px;
        background: linear-gradient(180deg, #ffd45b 0%, #f7b927 100%);
        box-shadow: 0 10px 18px rgba(208, 155, 32, 0.18);
      }

      .folder-icon::before {
        content: "";
        position: absolute;
        left: 10px;
        top: -8px;
        width: 34px;
        height: 18px;
        border-radius: 8px 8px 0 0;
        background: linear-gradient(180deg, #ffd96f, #f6bf3c);
      }

      .folder-icon::after {
        content: "";
        position: absolute;
        left: 8px;
        right: 8px;
        top: 16px;
        height: 34px;
        border-radius: 6px;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.56), rgba(255, 255, 255, 0.08));
      }

      .folder-name {
        color: var(--sky-ink);
        font-size: 13px;
        font-weight: 400;
        letter-spacing: 0;
        text-align: center;
      }

      .folder-count {
        color: var(--sky-muted);
        font-size: 11px;
        text-align: center;
      }

      .file {
        display: grid;
        justify-items: center;
        align-content: start;
        gap: 8px;
        padding: 10px 8px 8px;
        border-radius: 12px;
        transition: transform 160ms ease, background-color 160ms ease;
      }

      .file:hover {
        transform: translateY(-1px);
        background: rgba(255, 255, 255, 0.36);
      }

      .file-icon {
        position: relative;
        width: 92px;
        height: 70px;
        border-radius: 10px;
        background: linear-gradient(180deg, #ffffff, #f5f7fb);
        box-shadow: 0 10px 18px rgba(64, 96, 156, 0.08), 0 0 0 1px rgba(40, 78, 150, 0.08);
      }

      .file-icon::before {
        content: "";
        position: absolute;
        right: 14px;
        top: 12px;
        width: 24px;
        height: 30px;
        background:
          linear-gradient(180deg, transparent 0 12px, rgba(40, 78, 150, 0.4) 12px 13px, transparent 13px 100%),
          linear-gradient(135deg, transparent 0 18px, rgba(40, 78, 150, 0.4) 18px 19px, transparent 19px 100%),
          linear-gradient(180deg, #ffffff, #fdfefe);
        clip-path: polygon(0 0, 68% 0, 100% 28%, 100% 100%, 0 100%);
        box-shadow: inset 0 0 0 1px rgba(40, 78, 150, 0.18);
      }

      .file-name {
        color: var(--sky-ink);
        font-size: 12px;
        font-weight: 400;
        letter-spacing: 0;
        text-align: center;
        word-break: break-word;
      }

      .folder-tree {
        display: grid;
        gap: 18px;
      }

      .folder-row {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }

      .folder-group {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        min-width: 0;
      }

      .folder-group .folder-icon {
        flex: 0 0 auto;
      }

      .folder-group .folder-name,
      .folder-group .folder-count {
        text-align: left;
      }

      .file-group {
        display: flex;
        align-items: flex-start;
        gap: 12px;
      }

      .notes-list {
        display: grid;
      }

      .note-item {
        padding: 14px 14px 16px;
        border-top: 1px solid rgba(40, 78, 150, 0.08);
      }

      .note-item:first-child {
        border-top: 0;
      }

      .note-item-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 6px;
      }

      .note-item-top strong {
        font-size: 16px;
        font-weight: 500;
      }

      .note-item-top span {
        color: var(--sky-muted);
        font-size: 12px;
      }

      .note-item p {
        color: var(--sky-text);
        font-size: 13px;
        line-height: 1.7;
      }

      .notes-card .note-item + .note-item {
        background: rgba(255, 255, 255, 0.66);
      }

      .layout {
        margin-top: 18px;
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 18px;
      }

      .section-label + .materials-card,
      .section-label + .notes-card {
        box-shadow: 0 0 0 1px rgba(15, 23, 42, 0.04);
      }

      .footer-note {
        margin-top: 14px;
        color: var(--sky-muted);
        font-size: 12px;
        line-height: 1.6;
      }

      @media (max-width: 900px) {
        .topbar {
          flex-direction: column;
        }
      }

      @media (max-width: 720px) {
        .app-shell {
          width: min(100% - 12px, 100%);
          min-height: calc(100vh - 12px);
          margin: 6px auto;
          padding: 8px;
        }

        .main-panel {
          min-height: calc(100vh - 28px);
          padding: 14px;
        }

        .topbar h1 {
          font-size: 28px;
        }

        .topbar p {
          font-size: 14px;
        }
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <main class="main-panel">
        <header class="topbar">
          <div>
            <p class="eyebrow">StudySeq / 知序</p>
            <h1>ROS2 / 学习内容详情</h1>
            <p>资料优先的详情页。先处理学习资料，再往下看笔记。信息节奏稳定，适合长文档阅读。</p>
          </div>

          <div class="toolbar">
            <button class="ghost-button">新建文件夹</button>
            <button class="primary-button">＋ 新建笔记</button>
          </div>
        </header>

        <section class="layout">
          <div class="section">
            <span class="section-label">学习资料</span>
            <div class="materials-card">
              <div class="materials-head">
                <strong>基础篇</strong>
                <span>3 项</span>
              </div>
              <div class="folder-list">
                <div class="folder-tree">
                  <div class="folder-row">
                    <div class="folder-group">
                      <div class="folder">
                        <div class="folder-icon"></div>
                        <div class="folder-name">01 入门</div>
                        <div class="folder-count">2 文件</div>
                      </div>
                    </div>

                    <div class="folder-group">
                      <div class="folder">
                        <div class="folder-icon"></div>
                        <div class="folder-name">02 实践</div>
                        <div class="folder-count">3 文件</div>
                      </div>
                    </div>
                  </div>

                  <div class="folder-row">
                    <div class="file">
                      <div class="file-icon"></div>
                      <div class="file-name">ROS2 入门.pdf</div>
                    </div>

                    <div class="file">
                      <div class="file-icon"></div>
                      <div class="file-name">课程视频.mp4</div>
                    </div>

                    <div class="file">
                      <div class="file-icon"></div>
                      <div class="file-name">学习笔记.docx</div>
                    </div>

                    <div class="file">
                      <div class="file-icon"></div>
                      <div class="file-name">进度表.xlsx</div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="section">
            <span class="section-label">笔记</span>
            <div class="notes-card">
              <div class="note-head">
                <strong>学习笔记</strong>
                <span>平铺列表 + 可分组</span>
              </div>
              <div class="notes-list">
                <div class="note-item">
                  <div class="note-item-top">
                    <strong>学习笔记 01</strong>
                    <span>今天</span>
                  </div>
                  <p>记录课程中的关键概念，方便后续回看。可平铺展示，也可以按标题快速分组。</p>
                </div>

                <div class="note-item">
                  <div class="note-item-top">
                    <strong>学习笔记 02</strong>
                    <span>昨天</span>
                  </div>
                  <p>把推导过程和实践中踩坑的结论放在一起，避免只看资料不沉淀。</p>
                </div>
              </div>
            </div>
          </div>
        </section>

        <p class="footer-note">适合：阅读优先、资料较多、希望先看资料再写笔记的场景。</p>
      </main>
    </div>
  </body>
</html>
